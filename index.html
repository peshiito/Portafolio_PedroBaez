<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#FF3131" />

    <title>Pedro Baez — Diseño y desarrollo web para negocios</title>
    <meta
      name="description"
      content="Hago sitios web a medida para negocios que ya funcionan bien en persona: comercios, pymes y emprendimientos. Diseño y programo yo, sin plantillas, y te contesto el mismo día."
    />
    <link rel="canonical" href="https://portafoliopedrobaez.vercel.app/" />
    <meta name="author" content="Pedro Baez" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- La tarjeta que se ve al pegar el link en WhatsApp, Instagram o LinkedIn.
         Sin og:image sólo aparece el texto, sin imagen. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pedro Baez" />
    <meta property="og:url" content="https://portafoliopedrobaez.vercel.app/" />
    <meta property="og:title" content="Pedro Baez — Diseño y desarrollo web para negocios" />
    <meta
      property="og:description"
      content="Sitios web a medida para comercios, pymes y emprendimientos. Diseño y programo yo, sin plantillas."
    />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:image" content="https://portafoliopedrobaez.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Pedro Baez — sitios web a medida para negocios que ya funcionan bien en persona"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pedro Baez — Diseño y desarrollo web para negocios" />
    <meta
      name="twitter:description"
      content="Sitios web a medida para comercios, pymes y emprendimientos. Diseño y programo yo, sin plantillas."
    />
    <meta name="twitter:image" content="https://portafoliopedrobaez.vercel.app/og.png" />

    <!-- Para que Google entienda qué es esto y quién lo hace -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "@id": "https://portafoliopedrobaez.vercel.app/#negocio",
        "name": "Pedro Baez — Diseño y desarrollo web",
        "url": "https://portafoliopedrobaez.vercel.app/",
        "image": "https://portafoliopedrobaez.vercel.app/og.png",
        "description": "Diseño y desarrollo de sitios web a medida para comercios, pymes y emprendimientos.",
        "priceRange": "$$",
        "founder": { "@type": "Person", "name": "Pedro Baez", "jobTitle": "Diseñador y desarrollador web" },
        "areaServed": { "@type": "Country", "name": "Argentina" },
        "address": { "@type": "PostalAddress", "addressLocality": "Buenos Aires", "addressCountry": "AR" },
        "knowsAbout": [
          "Diseño web",
          "Desarrollo web",
          "Sitios web para pymes",
          "Tiendas online",
          "Landing pages",
          "Rediseño de sitios web"
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Servicios",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Sitio institucional" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Landing de campaña" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Tienda online" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Rediseño y migración" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Mantenimiento mensual" } }
          ]
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

    <script>
      // Aplica el tema antes del primer paint para que no haya destello.
      (function () {
        try {
          var t = localStorage.getItem('pb-theme');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-bs-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
